# ---------------------------------------------------------------------------
# Scatter - the Scatter theme (FlatLightLaf subclass, see ui/theme/ScatterLaf.java)
#
# Visual contract (DESIGN_SYSTEM.md, "Interface Kit / Zinc Bento"): zinc-100
# page ground, white cards with a 1px zinc-200 border and a very light neutral
# shadow, restrained blue accents (#2563eb fill / #1d4ed8 hover text / #eff6ff
# selection wash), a zinc-900 primary button, three semantic colours
# (green / amber / red), radii 20 / 12 / 8 / 999, 200ms ease-out transitions,
# sans-serif headings, no icons anywhere.
#
# This file is loaded last (see architecture.md 3.9), so it restates every
# shape key it needs: anything omitted would be inherited from
# FlatLightLaf.properties or the shared FlatLaf.properties instead.
#
# Edit a value, save, then switch the theme once in Settings -> Theme to see it
# (FlatLaf re-reads these files).
#
# ASCII only: FlatLaf reads this file with Properties.load(InputStream), i.e.
# ISO-8859-1. Longer explanations live in documents/architecture.md.
# ---------------------------------------------------------------------------

Scatter.Theme.Name = Scatter

# --- Scatter.Brand.* tokens (read by ui/theme/ScatterStyle.java) ---
# Zinc neutral scale + one restrained blue; the primary button is a solid
# blue with white text (user call: no dark buttons). Semantic colours come in
# a "600" text tone and a "50" soft tone used as the badge background.
Scatter.Brand.ground = #f4f4f5
Scatter.Brand.surface = #ffffff
Scatter.Brand.surfaceAlt = #fafafa
Scatter.Brand.ink = #18181b
Scatter.Brand.muted = #3f3f46
Scatter.Brand.border = #e4e4e7
Scatter.Brand.borderStrong = #d4d4d8
Scatter.Brand.accent = #2563eb
Scatter.Brand.accentDeep = #1d4ed8
Scatter.Brand.accentSoft = #eff6ff
Scatter.Brand.success = #059669
Scatter.Brand.successSoft = #ecfdf5
Scatter.Brand.warning = #d97706
Scatter.Brand.warningSoft = #fffbeb
Scatter.Brand.danger = #dc2626
Scatter.Brand.dangerSoft = #fef2f2
Scatter.Brand.inkOnAccent = #ffffff
Scatter.Brand.focus = #2563eb
Scatter.Brand.hoverWash = #f4f4f5
Scatter.Brand.shadow = #18181b

# --- FlatLaf core defaults ---
# Zinc neutrals everywhere; blue only marks interaction and selection.
@accentColor = #2563eb
@background = #f4f4f5
@foreground = #18181b
@componentBackground = #ffffff
@buttonBackground = #ffffff
@textBackground = #fafafa
@selectionBackground = #dbeafe
@selectionForeground = #1d4ed8
@menuBackground = #ffffff
@borderColor = #e4e4e7
@focusColor = #2563eb
@disabledText = #a1a1aa

TabbedPane.selectedBackground = #ffffff
Component.arrowType = chevron

# --- shape language: 20 / 12 / 8 / 999 only ---
Component.arc = 12
Button.arc = 12
CheckBox.arc = 6
TextComponent.arc = 12
ProgressBar.arc = 6
ScrollBar.trackArc = 999
ScrollBar.thumbArc = 999
MenuItem.selectionArc = 8
MenuBar.selectionArc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 1
ScrollBar.width = 12
ScrollBar.thumbInsets = 2,2,2,2

# --- scroll bars: slim and pale, they must not compete with the cards ---
ScrollBar.thumb = #d4d4d8
ScrollBar.hoverThumbColor = #a1a1aa
ScrollBar.pressedThumbColor = #71717a
ScrollBar.track = #f4f4f5
ScrollBar.hoverTrackColor = #e4e4e7

Popup.borderCornerRadius = 16
PopupMenu.borderCornerRadius = 12

# --- shadows: neutral zinc, never tinted, default stays very light ---
Popup.dropShadowColor = #18181b
Popup.dropShadowOpacity = 0.12
InternalFrame.activeDropShadowColor = #18181b
InternalFrame.inactiveDropShadowColor = #d4d4d8

# --- menus: text-only rows (no icon column, no icon size keys) ---
MenuItem.margin = 6,12,6,12
MenuItem.minimumWidth = 120
MenuItem.selectionBackground = #eff6ff
MenuItem.selectionForeground = #1d4ed8
PopupMenu.borderInsets = 6,4,6,4

# --- window title bar (FlatLaf-drawn decorations, see Brand.installWindowDecorations) ---
# White header with a 1px bottom border, like the reference card shell.
TitlePane.background = #ffffff
TitlePane.foreground = #18181b
TitlePane.inactiveBackground = #fafafa
TitlePane.inactiveForeground = #71717a
TitlePane.borderColor = #e4e4e7
TitlePane.height = 34
TitlePane.buttonHoverBackground = #f4f4f5
TitlePane.buttonPressedBackground = #e4e4e7
