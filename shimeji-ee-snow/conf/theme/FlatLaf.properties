# ---------------------------------------------------------------------------
# Scatter theme - shared structure (loaded for every theme: Scatter, Light, Dark)
#
# Colours live in FlatLightLaf.properties / FlatDarkLaf.properties /
# ScatterLaf.properties; this file only holds the shape that does not depend on the
# palette. Every key here is loaded on top of the FlatLaf defaults, so deleting a
# line restores the stock value. After editing, save and switch the theme once in
# Settings -> Theme.
#
# NOTE: FlatLaf reads this file with Properties.load(InputStream), i.e. as
# ISO-8859-1. Keep comments and values ASCII-only; longer descriptions belong in
# documents/architecture.md.
#
# Failure modes (measured on FlatLaf 3.7.2): an invalid value silently drops
# just that one key and that key falls back to the FlatLaf factory value (it
# also shadows the same key from any earlier source), while a malformed escape
# sequence makes the whole themed install fail - the app then falls back to the
# stock FlatLaf look so the UI never comes up half-configured. Neither case
# blocks startup.
# ---------------------------------------------------------------------------

# Sentinel key: ThemeInstaller reads it to tell "the files were applied" from
# "the files exist but FlatLaf silently dropped them".
Scatter.Theme.Rev = 1

# Rounded but restrained - matches the card language (20 / 12 / 8 / 999).
Component.arc = 12
Button.arc = 12
CheckBox.arc = 6
TextComponent.arc = 12
ProgressBar.arc = 6
ScrollBar.trackArc = 999
ScrollBar.thumbArc = 999
MenuItem.selectionArc = 8
MenuBar.selectionArc = 8

# Arrow style and focus ring.
Component.arrowType = chevron
Component.innerFocusWidth = 1

# Slimmer scroll bars.
ScrollBar.width = 12
ScrollBar.thumbInsets = 2,2,2,2

# Rounded popups. The mascot right-click menu and the tray menus are
# JPopupMenus and therefore use PopupMenu.*, not Popup.*
# (FlatPopupFactory.getBorderCornerRadius picks the key by component type).
Popup.borderCornerRadius = 16
PopupMenu.borderCornerRadius = 12

# Settings centre: left tab strip with a selection indicator.
TabbedPane.tabHeight = 34
TabbedPane.tabSelectionHeight = 3
TabbedPane.showTabSeparators = true
