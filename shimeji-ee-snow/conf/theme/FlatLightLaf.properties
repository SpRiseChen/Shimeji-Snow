# ---------------------------------------------------------------------------
# Scatter Light - colours only (structure is in FlatLaf.properties)
#
# This is the neutral light fallback next to the "Scatter" theme, not the brand
# look: it keeps the standard blue-500 accent instead of Scatter's blue-600 and
# shares the same zinc neutral base.
# ASCII only: FlatLaf reads this file as ISO-8859-1.
# ---------------------------------------------------------------------------

Scatter.Theme.Name = Scatter Light

# Standard blue: it drives focus rings, selections and check marks;
# FlatLaf derives every other accent shade from it.
@accentColor = #3B82F6

# Zinc-100 base instead of the stock neutral #f2f2f2. Panels, buttons and text
# fields are all derived from this variable.
@background = #F4F4F5

# The selected tab should read as "raised" against the zinc base.
TabbedPane.selectedBackground = #FFFFFF

# --- Scatter.Brand.* tokens (read by ui/theme/ScatterStyle.java) ---
# Same slot set as ScatterLaf.properties, so the self-painted components stay
# coherent in this theme instead of falling back slot by slot.
Scatter.Brand.ground = #f4f4f5
Scatter.Brand.surface = #ffffff
Scatter.Brand.surfaceAlt = #fafafa
Scatter.Brand.ink = #18181b
Scatter.Brand.muted = #3f3f46
Scatter.Brand.border = #e4e4e7
Scatter.Brand.borderStrong = #d4d4d8
Scatter.Brand.accent = #3b82f6
Scatter.Brand.accentDeep = #2563eb
Scatter.Brand.accentSoft = #eff6ff
Scatter.Brand.success = #0e8a5f
Scatter.Brand.successSoft = #e7f6ef
Scatter.Brand.warning = #b26a00
Scatter.Brand.warningSoft = #fff6e5
Scatter.Brand.danger = #c0392b
Scatter.Brand.dangerSoft = #fbecea
Scatter.Brand.inkOnAccent = #ffffff
Scatter.Brand.focus = #2563eb
Scatter.Brand.hoverWash = #f4f4f5
Scatter.Brand.shadow = #18181b
