# ---------------------------------------------------------------------------
# Scatter Dark - colours only (structure is in FlatLaf.properties)
#
# The dark surface is never pure black: the page ground stays zinc-900 and
# cards are lifted from it, matching the light theme's card-over-ground layering.
# ASCII only: FlatLaf reads this file as ISO-8859-1.
# ---------------------------------------------------------------------------

Scatter.Theme.Name = Scatter Dark

# Lighter blue: the light theme accent is too dark on a dark surface.
@accentColor = #60A5FA

# Zinc-900 base instead of the stock neutral #3c3f41.
@background = #18181B

# Slightly lifted from the base, derived so it tracks @background.
TabbedPane.selectedBackground = lighten(@background,6%)

# --- Scatter.Brand.* tokens (read by ui/theme/ScatterStyle.java) ---
# Same slot set as ScatterLaf.properties. Deliberate differences from the light
# palette: accents go brighter (dark text sits on the fills via inkOnAccent) and
# the "soft" badge tones are dark tints rather than near-white washes.
Scatter.Brand.ground = #18181b
Scatter.Brand.surface = #27272a
Scatter.Brand.surfaceAlt = #202024
Scatter.Brand.ink = #fafafa
Scatter.Brand.muted = #d4d4d8
Scatter.Brand.border = #3f3f46
Scatter.Brand.borderStrong = #52525b
Scatter.Brand.accent = #60a5fa
Scatter.Brand.accentDeep = #93c5fd
Scatter.Brand.accentSoft = #1e2a45
Scatter.Brand.success = #34d399
Scatter.Brand.successSoft = #22372e
Scatter.Brand.warning = #fbbf24
Scatter.Brand.warningSoft = #3a3222
Scatter.Brand.danger = #f87171
Scatter.Brand.dangerSoft = #3b2526
Scatter.Brand.inkOnAccent = #0b1220
Scatter.Brand.focus = #60a5fa
Scatter.Brand.hoverWash = #303033
Scatter.Brand.shadow = #000000
