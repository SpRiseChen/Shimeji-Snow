# Desktop speech: numbered entries form each random dialogue pool.
DialogueMovement1 = 陪你坐了半小时啦，起来伸个懒腰、活动一下身体吧！
DialogueMovement2 = 休息一小会儿吧！转转肩膀，走动两步，我在这里等你。
DialogueMovement3 = 嘿，该活动一下啦！站起来舒展舒展，看看远处吧。
DialogueWater1 = 该喝水啦！给自己倒杯水，慢慢喝几口吧。
DialogueWater2 = 陪伴你 45 分钟了，记得喝杯水哦！
DialogueWater3 = 小小喝水提醒：让杯子补满水，也让自己休息一下吧。
DialogueGoodbye1 = 今天也辛苦啦！我们下次再见，好好照顾自己哦。
DialogueGoodbye2 = 我要先回去休息啦，下次再陪你！再见～
DialogueGoodbye3 = 拜拜！记得休息和喝水，我会等你回来。
DialogueDismissHint = 点击收起 · 稍后自动消失
DialogueGoodbyeHint = 点击告别 · 稍后自动退出

