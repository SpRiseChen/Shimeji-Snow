# Shimeji Snow - default settings template
# This file is the single source of defaults shipped with the app; user overrides
# live in StateHome/settings.properties (written by the app). Safe mode (recovery after
# a crash) also boots from this file. Do not store personal values here.
# Dynamic keys not listed below: DisabledBehaviours.<setImageName>

# ---- startup / image sets ----
# Previous selection ("/"-separated folder names); preselected in the startup chooser.
ActiveShimeji=
# Bundled image set used in safe mode (user settings and mods are ignored).
Recovery.ImageSet=Acacia
# Legacy compatibility key; normal startup always shows the chooser.
AlwaysShowShimejiChooser=true
AlwaysShowInformationScreen=false
# "/"-separated image sets whose splash info was already shown
InformationDismissed=

# ---- general ----
# BCP-47 language tag; must match a language_*.properties file
# UI languages: zh-CN / en-GB / ja-JP / ko-KR; Simplified Chinese is the default.
Language=zh-CN
# UI menu font base DPI (auto-persisted on first run from screen resolution)
MenuDPI=96
# image scale factor, 1.0 = native; change requires an image reload
Scaling=1.0
# per-pixel alpha multiplier baked into images at load; change requires an image reload
# (runtime window-level opacity is the separate GlobalOpacity setting)
Opacity=1.0
# pixel filter when Scaling != 1.0: false = nearest neighbour, true/hqx = HQX, bicubic = bicubic
Filter=bicubic
# window-level runtime opacity (0.25~1.0), applied live without image reload
GlobalOpacity=1.0
# FlatLaf theme: scatter (the Scatter UI, default), light or dark (generic fallbacks)
Theme=scatter
# drop the hover lift/shadow animations (also honours the OS "reduce motion" preference)
ReduceMotion=false
# overrides the tray icon tooltip / window title
ShimejiEENameOverride=

# ---- update check ----
# GitHub Releases latest API endpoint; empty = feature disabled
UpdateCheck.Url=
# silent background check on startup (result only logged)
UpdateCheck.OnStartup=false

# ---- behaviour toggles ----
# 复制/克隆开关(Breeding、Transients)已按设计删除:shimeji 不再自我复制,
# 新个体只能由用户手动添加(托盘"More"里的 Choose Shimeji)。
Transformation=true
Throwing=true
Sounds=true
# allow mascots to wander across all monitors (false = stay on first screen)
Multiscreen=true
# active screen for mascots: mouse = follow mouse (legacy), primary, or monitor index 0/1/...
ActivityScreen=mouse

# ---- interactive windows ----
# "/"-separated window title substrings pets may interact with; empty = all windows
InteractiveWindows=
# blacklist wins over the whitelist
InteractiveWindowsBlacklist=

# ---- display mode ----
# generic = desktop, virtual = inside a desktop window (dev/demo)
Environment=generic
WindowSize=600x500
Background=#00FF00
BackgroundMode=centre
BackgroundImage=

# Position rendering is independent of the fixed 25 Hz logic clock (restart to apply).
Render.Fps=60
# Larger position jumps snap instead of traversing the desktop (logical pixels).
Render.TeleportDistance=256
