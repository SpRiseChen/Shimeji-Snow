AboutUsageText = キャラクター素材や Mod のライセンスを守り、信頼できる Mod とプラグインのみを導入してください。健康リマインダーは日常的な目安であり、医療上の助言ではありません。本ソフトウェアは現状のまま、無保証で提供されます。
