# 手势交互系统参数(阶段 2a)。数值含义参见 HeadPatDirector/Grip。
# 缺失或非法的键回退到内置默认值;所有坐标均为 AWT 逻辑像素。
# 阈值参考 Little LUMI 反编译实测值(2026-09-14),后续按手感调整。

# 轮询周期与鲁棒性
gesture.tickMs=50
gesture.failLimit=100
gesture.backoffMs=2000

# Grip 延迟判定(按下热点后,移动如何分类)
# 单向行程达到 strokePx 记一次方向;方向反转达到 rubReversals 次判定为摩擦(摸头)
gesture.strokePx=12
gesture.rubReversals=1
# 垂直位移超过 liftDyPx 或水平位移超过 liftDxPx 判定为拿起(进入拖拽)
gesture.liftDyPx=40
gesture.liftDxPx=96

# 按住不动自动摸头
gesture.holdMs=700
gesture.holdSlackPx=6

# 摸头进行中的跟手/点头(滞回带:进入 sideEnterPx,退出 sideExitPx)
gesture.sideEnterPx=18
gesture.sideExitPx=8
gesture.minPatMs=1000
gesture.nodMs=500

# 行为命名约定:以 patPrefix 开头的行为视为摸头循环;
# Tilt2/Tilt3 后缀为左右偏头变体(由代码拼接,不可配置)。
gesture.patPrefix=HeadPat

# 摸头结束/中断后回到的"原姿势"行为(NextBehaviorList 塞子在 behaviors.xml 中与之保持一致)
gesture.rest.HeadPat=StandUp
gesture.rest.HeadPatSit=SitDown
