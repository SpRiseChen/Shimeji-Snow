# Desktop speech: numbered entries form each random dialogue pool.
DialogueMovement1 = We've been here for half an hour. Time to stand up and stretch!
DialogueMovement2 = Take a little break! Roll your shoulders and walk a few steps. I'll wait here.
DialogueMovement3 = Time to move a little! Stretch your legs and look into the distance.
DialogueWater1 = Water break! Pour yourself a glass and take a few sips.
DialogueWater2 = It's been 45 minutes. Remember to have a glass of water!
DialogueWater3 = A little reminder: refill your water and give yourself a moment to rest.
DialogueGoodbye1 = Thanks for today! See you next time, and take care of yourself.
DialogueGoodbye2 = I'm off to rest. I'll keep you company next time. Bye!
DialogueGoodbye3 = Bye! Remember to rest and drink water. I'll be waiting for you.
