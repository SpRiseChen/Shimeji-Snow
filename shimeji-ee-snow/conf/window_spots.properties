# Shimeji Snow - window spot rules
# Controls which window borders mascots may sit on / climb, per window title match.
# Matching is case-insensitive substring on the window title (same convention as
# InteractiveWindows whitelist/blacklist). Unmatched windows use spots.default.
#
# Spot values (comma separated): top (sit on top edge), bottom, left, right;
# "none" = no interaction with this window's frame at all.
# Key suffix is matched against the title: spots.rule.<substring>

# ---- global defaults ----
spots.default=top,left,right,bottom
# how many mascots may interact with the same window at once (0 = unlimited)
maxPetsPerWindow=2

# ---- occlusion (fullscreen window covering the pet) ----
occlusion.enabled=true
# hide = hide the pet while covered, restore when uncovered; off = do nothing
occlusion.action=hide
occlusion.checkIntervalMs=500

# ---- example rules (uncomment & adjust) ----
# spots.rule.Notepad=top
# spots.rule.Calculator=none
